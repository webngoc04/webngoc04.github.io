name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify-authority:
    name: Security Guard - Verify Deployer Authority
    runs-on: ubuntu-latest
    steps:
      - name: Enforce KeiChan Exclusive Deployment Authority
        run: |
          echo "=========================================================="
          echo "🔒 SECURITY BARRIER: ENFORCING EXCLUSIVE DEPLOYMENT POLICY"
          echo "=========================================================="
          ALLOWED_USERS=("webngoc04" "KeiChan")
          CURRENT_ACTOR="${{ github.actor }}"
          TRIGGER_ACTOR="${{ github.triggering_actor }}"
          REPO="${{ github.repository }}"

          echo "Target Repository : $REPO"
          echo "Triggered by Actor: $CURRENT_ACTOR"
          echo "Triggering Actor  : $TRIGGER_ACTOR"

          if [ "$REPO" != "webngoc04/webngoc04.github.io" ]; then
            echo "::error title=Repository Mismatch::Deployment only permitted on official repository webngoc04/webngoc04.github.io"
            exit 1
          fi

          IS_AUTHORIZED=false
          for user in "${ALLOWED_USERS[@]}"; do
            if [ "$CURRENT_ACTOR" = "$user" ] || [ "$TRIGGER_ACTOR" = "$user" ]; then
              IS_AUTHORIZED=true
              break
            fi
          done

          if [ "$IS_AUTHORIZED" != "true" ]; then
            echo "::error title=Access Denied::Unauthorized deployment attempt by '$CURRENT_ACTOR'."
            echo "CRITICAL: Only KeiChan (webngoc04) is authorized to modify, build, and deploy this website."
            echo "All unauthorized commits, fork merges, and automated pull requests are strictly blocked."
            exit 1
          fi
          echo "✅ Authorization confirmed. Deployer is KeiChan ($CURRENT_ACTOR)."

  build:
    name: Build Static Export & Seal Hashes
    runs-on: ubuntu-latest
    needs: verify-authority
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Immutable Build-Time SHA-256 Checksums
        run: npm run prebuild

      - name: Build Static Export
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to Production
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
